<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국 방문 지도</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--fg:#1f2328;--muted:#6b7280;--accent:#2f6fed;--on:#fff;--field:#eceef2;--sep:#fff;--track:#e5e7eb;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--fg:#ececec;--muted:#9a9aa0;--accent:#6ea2ff;--on:#0b1b3a;--field:#2d2d32;--sep:#191919;--track:#3a3a3f}}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--fg);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif}
body{padding:14px}
.w{max-width:520px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.big{font-size:26px;font-weight:800;letter-spacing:-.02em}
.big small{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:0}
.sub{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--track);border-radius:3px;margin:8px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s ease}
svg{display:block;width:100%;height:auto;max-height:68vh}
.p{fill:var(--field);stroke:var(--sep);stroke-width:1.2;stroke-linejoin:round;cursor:pointer;fill-rule:evenodd}
.p:hover{filter:brightness(.94)}
.p.s1{fill:var(--accent)}
.p.s2{fill:color-mix(in srgb,var(--accent) 28%,transparent);stroke:var(--accent);stroke-dasharray:4 3}
.p:focus-visible{outline:none;stroke:var(--fg);stroke-width:2.4}
.lb{font-size:11px;font-weight:500;fill:var(--fg);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.lb.s1{fill:var(--on)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font:inherit;font-size:13px;color:var(--fg);background:var(--field);border:1px solid var(--track);border-radius:14px;padding:4px 10px;cursor:pointer}
.chip.s1{background:var(--accent);border-color:var(--accent);color:var(--on)}
.chip.s2{border-color:var(--accent);border-style:dashed}
.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12px;color:var(--muted);margin:10px 0 0}
.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;color:var(--fg);background:var(--field);border:1px solid var(--track);border-radius:8px;padding:7px 12px;cursor:pointer}
.out{display:none;width:100%;margin-top:8px;font:inherit;font-size:12px;color:var(--muted);background:var(--field);border:1px solid var(--track);border-radius:8px;padding:8px 10px}
.out.on{display:block}
</style>
</head>
<body>
<main class="w">
  <div class="head">
    <div class="big"><span id="nv">0</span><small>/ 17곳 방문 · <span id="pc">0</span>%</small></div>
    <div class="sub">위시 <b id="nw">0</b>곳</div>
  </div>
  <div class="bar"><i id="fill"></i></div>
  <svg id="map" viewBox="-6 -6 453 562" role="group" aria-label="대한민국 시도 지도"></svg>
  <div class="chips" id="chips"></div>
  <p class="hint">지역을 누를 때마다 방문 → 위시 → 해제 순으로 바뀌어요.</p>
  <div class="tools">
    <button class="btn" id="share" type="button">기록이 담긴 링크 만들기</button>
    <button class="btn" id="reset" type="button">초기화</button>
  </div>
  <input class="out" id="out" type="text" readonly aria-label="기록이 담긴 링크">
</main>
